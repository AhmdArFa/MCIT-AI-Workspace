map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 3210;
    server_name _;

    resolver 127.0.0.11 valid=10s;

    # MCIT AI Studio is the only document creation surface. The agent's
    # legacy embedded DeckCraft/PDF editors are not exposed to users.
    location ~ ^/(studio|webapi/mcit/studio)(/|$) {
        return 404;
    }

    # API and OAuth callbacks are proxied directly
    location /api/ {
        set $tut_backend http://tut-agent:3210;
        proxy_pass $tut_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 100m;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        chunked_transfer_encoding on;
    }

    location / {
        set $tut_backend http://tut-agent:3210;
        proxy_pass $tut_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 100m;

        # Disable buffering and cache for real-time updates
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        chunked_transfer_encoding on;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
